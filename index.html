<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>j.cam Video Library</title>
    <link rel="preconnect" href="https://stream.mux.com" crossorigin>
    <link rel="preconnect" href="https://image.mux.com" crossorigin>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 1px solid #222;
            margin-bottom: 30px;
        }

        header .logo {
            max-width: 200px;
            height: auto;
            margin-bottom: 16px;
        }

        header h2 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .library-controls-sticky {
            position: sticky;
            top: 0;
            z-index: 40;
            margin: 0 -20px 20px;
            padding: 12px 20px 14px;
            background: rgba(10, 10, 10, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid #252525;
        }

        .library-controls-inner {
            max-width: 900px;
            margin: 0 auto;
        }

        .search-container {
            position: relative;
            margin-bottom: 12px;
        }

        .filters-panel {
            margin-bottom: 10px;
        }

        .filters-panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .filters-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filters-actions .refresh-catalog-btn {
            padding: 8px 12px;
            font-size: 0.82rem;
        }

        .filters-panel-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #666;
        }

        .filters-reset {
            padding: 4px 10px;
            font-size: 0.78rem;
            font-weight: 600;
            color: #e63946;
            background: transparent;
            border: 1px solid #333;
            border-radius: 8px;
            cursor: pointer;
        }

        .filters-reset:hover {
            border-color: #e63946;
            color: #ff5c6c;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px 12px;
        }

        @media (min-width: 720px) {
            .filters-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        .filter-field label {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #777;
            margin-bottom: 4px;
        }

        .filter-field select {
            width: 100%;
            padding: 8px 10px;
            font-size: 0.88rem;
            border: 2px solid #333;
            border-radius: 10px;
            background: #141414;
            color: #fff;
            cursor: pointer;
        }

        .filter-field select:focus {
            outline: none;
            border-color: #e63946;
        }

        .library-controls-sticky .stats {
            margin-bottom: 0;
            font-size: 0.82rem;
            color: #777;
        }

        .refresh-catalog-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 2px solid #333;
            border-radius: 10px;
            background: #111;
            color: #fff;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s, color 0.2s;
            white-space: nowrap;
        }

        .refresh-catalog-btn:hover {
            border-color: #e63946;
            background: #1a1a1a;
        }

        .refresh-catalog-btn:focus {
            outline: none;
            border-color: #e63946;
            box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.2);
        }

        .refresh-catalog-btn svg {
            flex-shrink: 0;
            opacity: 0.9;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            font-size: 1rem;
            border: 2px solid #333;
            border-radius: 12px;
            background: #111;
            color: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: #e63946;
            box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.2);
        }

        .search-input::placeholder {
            color: #666;
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }

        .stats {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        .video-card {
            position: relative;
            aspect-ratio: 9/16;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            background: #1a1a1a;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .catalog-sentinel {
            grid-column: 1 / -1;
            height: 80px;
            pointer-events: none;
        }

        .video-card:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 30px rgba(230, 57, 70, 0.3);
        }

        .video-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s;
        }

        .video-card img.gif-preview {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
        }

        .video-card:hover img.gif-preview {
            opacity: 1;
        }

        .video-card:hover img.thumbnail {
            opacity: 0;
        }

        .video-card .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 60px 12px 12px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
        }

        .video-card .category {
            display: inline-block;
            padding: 4px 8px;
            background: rgba(230, 57, 70, 0.9);
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .video-card .keyword {
            font-size: 0.8rem;
            color: #ccc;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            overflow: hidden;
            overflow-wrap: anywhere;
            margin-bottom: 8px;
        }

        .video-card-stats {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            row-gap: 6px;
            font-size: 0.72rem;
            color: #aaa;
        }

        .video-card-stats .stat {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            min-width: 0;
        }

        .video-card-stats .stat svg {
            flex-shrink: 0;
            opacity: 0.85;
        }

        .video-card .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .video-card:hover .play-icon {
            opacity: 1;
        }

        .video-card .hide-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            background: rgba(0,0,0,0.7);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s, background 0.2s;
        }

        .video-card:hover .hide-btn {
            opacity: 1;
        }

        .video-card .hide-btn:hover {
            background: rgba(230, 57, 70, 0.9);
        }

        .play-icon svg {
            width: 24px;
            height: 24px;
            fill: #0a0a0a;
            margin-left: 4px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 40px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-height: calc(100vh - 80px);
            max-width: calc((100vh - 80px) * 9 / 16);
            width: 100%;
            background: #111;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.6);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .modal-close:hover {
            background: rgba(0,0,0,0.8);
        }

        .modal-nav {
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s, opacity 0.2s;
        }

        .modal-nav:hover {
            background: rgba(255,255,255,0.2);
        }

        .modal-nav:disabled {
            opacity: 0.2;
            cursor: default;
        }

        .modal-nav.prev {
        }

        .modal-nav.next {
        }

        @media (max-width: 800px) {
            .modal {
                gap: 8px;
                padding: 20px 8px;
            }
            .modal-nav {
                width: 36px;
                height: 36px;
                font-size: 22px;
            }
        }

        .modal-video-wrap {
            position: relative;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: #000;
        }

        .modal-video {
            width: 100%;
            flex: 1;
            min-height: 0;
            background: #000;
            object-fit: contain;
        }

        .modal-download-count {
            position: absolute;
            right: 12px;
            bottom: 12px;
            z-index: 5;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #fff;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(6px);
            pointer-events: none;
            line-height: 1.2;
        }

        .modal-info {
            padding: 20px;
            flex-shrink: 0;
            overflow-y: auto;
            max-height: 280px;
        }

        .modal-info h3 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: #fff;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            overflow: hidden;
            overflow-wrap: anywhere;
        }

        .modal-info #downloadArea {
            margin-bottom: 12px;
        }

        .modal-info .description {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 16px;
            line-height: 1.5;
            max-height: 80px;
            overflow-y: auto;
        }

        .modal-info .summary {
            font-size: 0.85rem;
            color: #999;
            line-height: 1.5;
            padding-top: 12px;
            border-top: 1px solid #222;
            margin-top: 12px;
        }

        .modal-info .hashtags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
        }

        .modal-info .hashtag {
            padding: 4px 10px;
            background: #222;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #e63946;
        }

        .download-btn {
            width: 100%;
            padding: 14px;
            background: #e63946;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .download-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .download-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #666;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #e63946;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #666;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Auth */
        .auth-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .auth-bar .user-email {
            font-size: 0.85rem;
            color: #888;
        }

        .auth-btn {
            padding: 8px 20px;
            border: 1px solid #e63946;
            border-radius: 8px;
            background: transparent;
            color: #e63946;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .auth-btn:hover {
            background: #e63946;
            color: #fff;
        }

        .auth-btn.primary {
            background: #e63946;
            color: #fff;
        }

        .auth-btn.primary:hover {
            background: #c1222f;
        }

        .auth-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .auth-modal.active {
            display: flex;
        }

        .auth-modal-content {
            background: #141414;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        .auth-modal-content h2 {
            font-size: 1.4rem;
            margin-bottom: 8px;
        }

        .auth-modal-content .subtitle {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }

        .auth-modal-content .form-group {
            margin-bottom: 16px;
        }

        .auth-modal-content label {
            display: block;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .auth-modal-content input[type="email"],
        .auth-modal-content input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            border: 2px solid #333;
            border-radius: 10px;
            background: #0a0a0a;
            color: #fff;
            transition: border-color 0.2s;
        }

        .auth-modal-content input:focus {
            outline: none;
            border-color: #e63946;
        }

        .auth-modal-content .auth-submit {
            width: 100%;
            padding: 14px;
            background: #e63946;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }

        .auth-modal-content .auth-submit:hover {
            opacity: 0.9;
        }

        .auth-modal-content .auth-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .auth-modal-content .auth-toggle {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #666;
        }

        .auth-modal-content .auth-toggle a {
            color: #e63946;
            cursor: pointer;
            text-decoration: none;
        }

        .auth-modal-content .auth-toggle a:hover {
            text-decoration: underline;
        }

        .auth-modal-content .auth-error {
            background: rgba(230, 57, 70, 0.1);
            border: 1px solid rgba(230, 57, 70, 0.3);
            border-radius: 8px;
            padding: 10px 14px;
            color: #e63946;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
        }

        .auth-modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            color: #666;
            font-size: 28px;
            cursor: pointer;
        }

        .auth-modal-close:hover {
            color: #fff;
        }

        .download-login-prompt {
            text-align: center;
            font-size: 0.85rem;
            color: #888;
            margin-top: 8px;
        }

        .download-login-prompt a {
            color: #e63946;
            cursor: pointer;
            text-decoration: none;
        }

        .download-login-prompt a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .video-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            header h1 {
                font-size: 1.8rem;
            }

            .modal-content {
                max-width: 100%;
                max-height: 90vh;
                overflow-y: auto;
            }

            .auth-modal-content {
                margin: 20px;
                padding: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-bar" id="authBar">
        <span class="user-email" id="userEmail" style="display: none;"></span>
        <button class="auth-btn" id="authLogoutBtn" style="display: none;" onclick="logout()">Log Out</button>
        <button class="auth-btn primary" id="authLoginBtn" onclick="showAuthModal('login')">Log In</button>
    </div>

    <div class="container">
        <header>
            <img src="j%20cam%20logo%20white.png" alt="jcam.app" class="logo">
            <h2>Video Library</h2>
        </header>

        <div class="library-controls-sticky">
            <div class="library-controls-inner">
                <div class="search-container">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <input type="text" class="search-input" id="searchInput" placeholder="Search by description, keyword, category, or hashtag...">
                </div>
                <div class="filters-panel">
                    <div class="filters-panel-head">
                        <span class="filters-panel-title">Optional filters</span>
                        <div class="filters-actions">
                            <button type="button" class="filters-reset" id="filtersResetBtn">Clear filters</button>
                            <button type="button" class="refresh-catalog-btn" id="shuffleCatalogBtn" title="Randomize the order of videos on this page" aria-label="Shuffle video order">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <polyline points="16 3 21 3 21 8"></polyline>
                                    <line x1="4" y1="20" x2="21" y2="3"></line>
                                    <polyline points="21 16 21 21 16 21"></polyline>
                                    <line x1="15" y1="15" x2="21" y2="21"></line>
                                    <line x1="4" y1="4" x2="9" y2="9"></line>
                                </svg>
                                Shuffle
                            </button>
                        </div>
                    </div>
                    <div class="filters-grid">
                        <div class="filter-field">
                            <label for="filterCategory">Category</label>
                            <select id="filterCategory" aria-label="Filter by category">
                                <option value="">All categories</option>
                            </select>
                        </div>
                        <div class="filter-field">
                            <label for="filterDuration">Duration</label>
                            <select id="filterDuration" aria-label="Filter by video length">
                                <option value="any">Any length</option>
                                <option value="lt30">Under 30s</option>
                                <option value="30-60">30s – 1 min</option>
                                <option value="60-180">1 – 3 min</option>
                                <option value="180p">3 min or longer</option>
                            </select>
                        </div>
                        <div class="filter-field">
                            <label for="filterEngagement">Engagement</label>
                            <select id="filterEngagement" aria-label="Filter by engagement rate">
                                <option value="all">Any</option>
                                <option value="high">High (≥ 5%)</option>
                                <option value="mid">Medium (1% – &lt; 5%)</option>
                                <option value="low">Lower (&lt; 1%)</option>
                                <option value="unknown">No views / unknown</option>
                            </select>
                        </div>
                        <div class="filter-field">
                            <label for="filterViews">Views</label>
                            <select id="filterViews" aria-label="Filter by TikTok view count">
                                <option value="any">Any views</option>
                                <option value="lt10k">Under 10K</option>
                                <option value="10k-100k">10K – 100K</option>
                                <option value="100k-1m">100K – 1M</option>
                                <option value="1mp">1M or more</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="stats" id="stats"></div>
            </div>
        </div>

        <div id="videoGrid" class="video-grid">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Loading videos...</p>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <button class="modal-nav prev" id="modalPrev" title="Previous video">&#8249;</button>
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
